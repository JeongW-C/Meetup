# md-reader(마크다운/텍스트 음성 리더) 빌드, 테스트, 릴리스.
# - 모든 푸시: 단위 테스트, 린트, APK·AAB 빌드, 에뮬레이터 스모크 테스트
# - main 푸시: GitHub Release(md-reader-v<versionName>)에 APK를 올린다
# 릴리스 서명은 저장소 Secrets(MDREADER_*)가 있으면 그것을, 없으면 디버그 키를 쓴다.
name: md-reader

on:
  push:
    paths:
      - "md-reader/**"
      - ".github/workflows/md-reader.yml"
  pull_request:
    paths:
      - "md-reader/**"
      - ".github/workflows/md-reader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: md-reader
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test --no-daemon

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MDREADER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MDREADER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "서명 Secrets 없음: 릴리스 APK를 디버그 키로 서명합니다."
          fi

      - name: Lint and build
        env:
          MDREADER_KEYSTORE_PASSWORD: ${{ secrets.MDREADER_KEYSTORE_PASSWORD }}
          MDREADER_KEY_ALIAS: ${{ secrets.MDREADER_KEY_ALIAS }}
          MDREADER_KEY_PASSWORD: ${{ secrets.MDREADER_KEY_PASSWORD }}
        run: |
          ./gradlew lintRelease assembleDebug assembleRelease bundleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/md-reader.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/md-reader-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/md-reader.aab

      - id: version
        run: echo "version=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: md-reader-apk
          path: md-reader/dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: md-reader-reports
          path: |
            md-reader/core/build/reports/
            md-reader/app/build/reports/

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: md-reader-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash md-reader/scripts/smoke-test.sh md-reader-debug.apk screenshots
      - name: Print screenshots as base64
        if: always()
        run: |
          for f in screenshots/*.png; do
            echo "=== BEGIN $f"
            base64 -w 0 "$f"; echo
            echo "=== END $f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-reader-screenshots
          path: screenshots/

  release:
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: md-reader-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: md-reader-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MD 리더 v${{ needs.build.outputs.version }}
          make_latest: false
          files: |
            md-reader.apk
            md-reader.aab
          body: |
            .md / .txt 파일을 한국어 음성으로 읽어 주는 안드로이드 앱입니다.
            휴대폰에서 md-reader.apk 를 내려받아 열고, "출처를 알 수 없는 앱" 설치를 허용하면 됩니다.
            한국어 음성이 없다고 나오면 설정 > 텍스트 음성 변환에서 한국어 음성 데이터를 설치하세요.
