name: ebook-reader APK

on:
  push:
    paths:
      - "ebook-reader/**"
      - ".github/workflows/ebook-reader.yml"
  pull_request:
    paths:
      - "ebook-reader/**"
      - ".github/workflows/ebook-reader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebook-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ebook-reader-debug-apk
          path: ebook-reader/app/build/outputs/apk/debug/app-debug.apk
