name: ebook-reader APK

on:
  push:
    paths:
      - "ebook-reader/**"
      - ".github/workflows/ebook-reader.yml"
  pull_request:
    paths:
      - "ebook-reader/**"
      - ".github/workflows/ebook-reader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebook-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ebook-reader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ebook-reader-apk
          path: ebook-reader/ebook-reader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ebook-reader-debug-apk
          path: ebook-reader/app/build/outputs/apk/debug/app-debug.apk

  # 에뮬레이터에서 samples/ 파일을 열어 보고 스크린샷을 남긴다
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ebook-reader-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ebook-reader/scripts/smoke-test.sh app-debug.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebook-reader-screenshots
          path: screenshots/
