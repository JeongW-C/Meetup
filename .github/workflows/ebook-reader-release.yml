# 태그(ebook-reader-v1.0 등)를 올리면 GitHub Release 페이지에 APK를 올린다.
# 지인에게는 Release 페이지 링크만 보내면 된다.
name: ebook-reader release

on:
  push:
    tags:
      - "ebook-reader-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebook-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ebook-reader.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: ebook-reader/ebook-reader.apk
          body: |
            안드로이드 이북리더 APK입니다.
            휴대폰에서 아래 ebook-reader.apk 를 눌러 내려받고, 설치 중 "출처를 알 수 없는 앱" 허용을 켜면 설치됩니다.
