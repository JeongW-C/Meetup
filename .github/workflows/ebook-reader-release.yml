# ebook-reader 가 바뀌면 GitHub Release 페이지에 APK를 올린다.
# 릴리스 이름은 app/build.gradle.kts 의 versionName 을 따른다(예: ebook-reader-v1.0).
# 같은 버전이면 기존 릴리스의 APK를 새로 빌드한 것으로 바꾼다.
# 지인에게는 Release 페이지 링크만 보내면 된다.
name: ebook-reader release

on:
  push:
    branches:
      - main
      - claude/project-thread-0e64o9
    paths:
      - "ebook-reader/app/**"
      - "ebook-reader/*.kts"
      - ".github/workflows/ebook-reader-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebook-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ebook-reader.apk
          version=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ebook-reader-v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 이북리더 v${{ steps.build.outputs.version }}
          make_latest: true
          files: ebook-reader/ebook-reader.apk
          body: |
            안드로이드 이북리더 APK입니다.
            휴대폰에서 아래 ebook-reader.apk 를 눌러 내려받고, 설치 중 "출처를 알 수 없는 앱" 허용을 켜면 설치됩니다.
